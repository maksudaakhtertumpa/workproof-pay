services:
  - type: web
    name: workproof-pay
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: SELLER_TIMEZONE
        value: America/Los_Angeles
      - key: SELLER_NAME
        value: Maksuda Akther Tumpa
      - key: DEFAULT_CLIENT_NAME
        value: Kopi Labs
      - key: DEFAULT_CLIENT_EMAIL
        value: sb-0tp6v53708007@personal.example.com
      - key: AI_REQUESTS_PER_HOUR
        value: "30"
