# Render's free plan puts the server to sleep after 15 minutes without visitors, so the first
# visit takes about a minute. This pings the live demo every 10 minutes so judges see it load quickly.
name: Keep the live demo awake

on:
  schedule:
    # Every 10 minutes, off the top of the hour when GitHub is busiest.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live demo
        run: |
          curl --silent --show-error --fail --max-time 90 --retry 2 --retry-delay 20 \
            -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://workproof-pay.onrender.com/api/config
